<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Kit - New Project</title>
    <style>
        @font-face {
            font-family: 'GT Walsheim';
            src: url('/fonts/GT-Walsheim-Regular.otf') format('opentype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'GT Walsheim';
            src: url('/fonts/GT-Walsheim-Medium.otf') format('opentype');
            font-weight: 500;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'GT Walsheim', sans-serif;
            overflow: hidden;
        }

        .flyer-container {
            width: 1080px;
            height: 1350px;
            position: relative;
            background-color: #050505;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* Subtle Grain Background */
        .bg-grain {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            pointer-events: none;
            opacity: 0.4;
            mix-blend-mode: overlay;
        }

        /* Glowing Headline */
        .headline-glow {
            position: absolute;
            bottom: 120px;
            width: 100%;
            text-align: center;
            font-family: 'GT Walsheim', sans-serif;
            font-size: 80px;
            font-weight: 400;
            color: #fff;
            text-shadow: 0 0 40px rgba(96, 165, 250, 0.4);
            letter-spacing: -2px;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* The Hero - Terminal Command */
        .terminal-hero {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 56px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
            margin-bottom: 60px;
            /* Space between command and tagline */
        }

        .prompt {
            color: #666;
            user-select: none;
        }

        .cmd {
            color: #fff;
        }

        .pkg {
            color: #fff;
        }

        .action {
            color: #fff;
        }

        /* Static Cursor */
        .cursor-pointer {
            width: 48px;
            height: 48px;
            display: inline-block;
            margin-left: 10px;
            margin-top: 30px;
            /* Offset to look natural */
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
        }

        /* Tagline */
        .tagline {
            font-family: 'GT Walsheim', sans-serif;
            font-size: 24px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
            z-index: 10;
        }

        /* Ambient Glows */
        .glow-primary {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .glow-secondary {
            position: absolute;
            top: 0;
            left: 0;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle at 20% 20%, rgba(167, 139, 250, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        .glow-accent {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 1000px;
            height: 800px;
            background: radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="flyer-container">
        <div class="bg-grain"></div>
        <div class="glow-primary"></div>
        <div class="glow-secondary"></div>
        <div class="glow-accent"></div>

        <div class="terminal-hero">
            <span class="prompt">$</span>
            <span class="cmd">npx</span>
            <span class="pkg">nexus-kit</span>
            <span class="action">init</span>
            <div class="cursor-pointer">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 3L19 13L13 14L18 22L15 24L10 16L5 20V3Z" fill="white" />
                    <path d="M5 3L19 13L13 14L18 22L15 24L10 16L5 20V3Z" stroke="black" stroke-width="2"
                        stroke-linejoin="round" />
                </svg>
            </div>
        </div>

        <div class="tagline">Everything you need. Nothing you don’t.</div>

        <div class="headline-glow">NexusUI</div>
    </div>
</body>

</html>

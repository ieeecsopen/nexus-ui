<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus UI - Usage Options</title>
    <style>
        @font-face {
            font-family: 'GT Walsheim';
            src: url('/fonts/GT-Walsheim-Regular.otf') format('opentype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'GT Walsheim';
            src: url('/fonts/GT-Walsheim-Bold.otf') format('opentype');
            font-weight: 700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'GT Walsheim', sans-serif;
            overflow: hidden;
        }

        .flyer-container {
            width: 1080px;
            height: 1350px;
            position: relative;
            background-color: #050505;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        /* Ambient Background (Consistent with Guerilla) */
        .bg-grain {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            pointer-events: none;
            opacity: 0.4;
            mix-blend-mode: overlay;
        }

        .glow-primary {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 900px;
            height: 900px;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .glow-secondary {
            position: absolute;
            top: -200px;
            left: -200px;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle at 50% 50%, rgba(167, 139, 250, 0.04) 0%, transparent 60%);
            pointer-events: none;
        }

        /* The Capability Stack */
        .stack-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 700px;
            z-index: 10;
        }

        .option-bar {
            display: flex;
            align-items: center;
            padding: 32px 48px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* Hover Effect simulation */
        .option-bar:nth-child(2) {
            /* Simulate active hover state for demo */
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(96, 165, 250, 0.4);
            transform: scale(1.02) translateX(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .option-bar:nth-child(2)::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #60a5fa;
            box-shadow: 0 0 15px #60a5fa;
        }

        /* Icon Styling */
        .icon-box {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-right: 32px;
            color: rgba(255, 255, 255, 0.8);
        }

        .option-bar:nth-child(2) .icon-box {
            background: rgba(96, 165, 250, 0.2);
            color: #60a5fa;
        }

        .text-content {
            display: flex;
            flex-direction: column;
        }

        .option-title {
            font-size: 32px;
            font-weight: 400;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .option-desc {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        /* Header */
        .header-section {
            text-align: center;
            margin-bottom: 80px;
            z-index: 10;
        }

        .main-headline {
            font-size: 80px;
            font-weight: 400;
            background: linear-gradient(180deg, #fff 0%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -3px;
            margin-bottom: 16px;
        }

        .sub-headline {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Arrows */
        .arrow-icon {
            margin-left: auto;
            opacity: 0.3;
        }

        .option-bar:nth-child(2) .arrow-icon {
            opacity: 1;
            color: #60a5fa;
        }

        /* Footer */
        .footer-section {
            position: absolute;
            bottom: 60px;
            text-align: center;
            width: 100%;
            z-index: 10;
        }

        .footer-url {
            font-size: 24px;
            color: #fff;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .footer-meta {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="flyer-container">
        <div class="bg-grain"></div>
        <div class="glow-primary"></div>
        <div class="glow-secondary"></div>

        <div class="header-section">
            <div class="sub-headline">Explore the Ecosystem</div>
            <div class="main-headline">Nexus Kit</div>
        </div>

        <div class="stack-container">
            <!-- Option 1 -->
            <div class="option-bar">
                <div class="icon-box">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 7L12 3L20 7M4 7L12 11M4 7V17L12 21M12 11L20 7M12 11V21M20 7V17L12 21"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <div class="text-content">
                    <div class="option-title">Components</div>
                    <div class="option-desc">50+ Pre-built elements</div>
                </div>
                <div class="arrow-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
            </div>

            <!-- Option 2 (Active) -->
            <div class="option-bar">
                <div class="icon-box">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 16l6-6 4 4 6-6M4 20h16" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <div class="text-content">
                    <div class="option-title">Templates</div>
                    <div class="option-desc">Start building in seconds</div>
                </div>
                <div class="arrow-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
            </div>

            <!-- Option 3 -->
            <div class="option-bar">
                <div class="icon-box">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                </div>
                <div class="text-content">
                    <div class="option-title">Theming</div>
                    <div class="option-desc">Full CSS variable control</div>
                </div>
                <div class="arrow-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
            </div>

            <!-- Option 4 -->
            <div class="option-bar">
                <div class="icon-box">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </div>
                <div class="text-content">
                    <div class="option-title">Documentation</div>
                    <div class="option-desc">Interactive guides & props</div>
                </div>
                <div class="arrow-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
            </div>
        </div>

        <div class="footer-section">
            <div class="footer-url">nexusui-dev.vercel.app</div>
            <div class="footer-meta">v1.0.0 • MIT License • 2024</div>
        </div>
    </div>
</body>

</html>
